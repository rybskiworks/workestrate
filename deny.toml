# cargo-deny configuration — supply-chain gates for workestrate.
# CDLA-Permissive-2.0 is required by webpki-root-certs/webpki-roots
# (permissive Linux Foundation data license). No `ring` clarify block:
# ring 0.17.14 publishes SPDX "Apache-2.0 AND ISC" — both terms allowed.
# advisories stay CI-only (continue-on-error) — the advisory DB needs
# network + git; deliberately NOT wired into `just verify`.

[licenses]
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "MPL-2.0",
  "CC0-1.0",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
]

[bans]
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# The runtime fork inherits libkrun and its private-memory implementation.
# Cargo.lock and the Nix fixed-output hash pin the exact source contents.
allow-git = [
  "https://github.com/rybskiworks/libkrun",
  "https://github.com/superradcompany/rust-vmm",
]
required-git-spec = "rev"
