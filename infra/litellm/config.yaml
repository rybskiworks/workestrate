# LiteLLM proxy — milestone 1, in-memory, no Postgres.
# Env var syntax: os.environ/VAR_NAME  →  os.getenv("VAR_NAME")
# Omit database_url to run in-memory; virtual keys/budgets are future scope.

model_list:
  - model_name: openai-gpt
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY

  - model_name: anthropic-claude
    litellm_params:
      model: anthropic/claude-sonnet-4-20250514
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: openrouter-default
    litellm_params:
      model: openrouter/openai/gpt-4o
      api_key: os.environ/OPENROUTER_API_KEY

litellm_settings:
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
