schema_version = 1

# Personal overrides pi memory to 2048
[workloads.pi]
kind = "agent"
image = { recipe = "registry", ref = "node:24-bookworm-slim" }
workdir = "/work"
cpus = 2
memory_mib = 2048
command = ["echo"]
log_stop_errors = false

[[workloads.pi.mounts]]
host = "${CWD}"
guest = "/work"
read_only = false

[workloads.pi.network.defaults]
egress = "deny"

[[workloads.pi.policy.egress.allow.host]]
ports = [53]
protocols = ["tcp", "udp"]

[[workloads.pi.policy.egress.allow.domain]]
domains = ["github.com", "api.github.com"]
port = 443
protocol = "tcp"

[[workloads.pi.policy.egress.deny.domain]]
domains = [".evil.com"]

# Personal adds another deny rule (additive)
[[workloads.pi.policy.egress.deny.domain]]
domains = [".tracker.io"]
