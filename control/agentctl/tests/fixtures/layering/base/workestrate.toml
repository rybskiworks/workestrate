schema_version = 1

[secrets.LITELLM_MASTER_KEY]
env_var = "LITELLM_MASTER_KEY"
hosts = ["host.microsandbox.internal"]
required = true

[workloads.pi]
kind = "agent"
image = { recipe = "registry", ref = "node:24-bookworm-slim" }
workdir = "/work"
cpus = 1
memory_mib = 1024
command = ["echo"]
log_stop_errors = false

[[workloads.pi.mounts]]
host = "${CWD}"
guest = "/work"
read_only = false

[workloads.pi.network]
default_deny = true

[[workloads.pi.network.egress]]
recipe = "dns"
