schema_version = 1

# Team overrides pi cpus to 2
[workloads.pi]
kind = "agent"
image = { recipe = "registry", ref = "node:24-bookworm-slim" }
workdir = "/work"
cpus = 2
memory_mib = 1024
command = ["echo"]
log_stop_errors = false

[[workloads.pi.mounts]]
host = "${CWD}"
guest = "/work"
read_only = false

[workloads.pi.network.defaults]
egress = "deny"

[[workloads.pi.policy.egress.allow.host]]
ports = [53]
protocols = ["tcp", "udp"]

[[workloads.pi.policy.egress.allow.domain]]
domains = ["github.com", "api.github.com"]
port = 443
protocol = "tcp"

# Team adds a deny rule
[[workloads.pi.policy.egress.deny.domain]]
domains = [".evil.com"]

# Team adds a secret
[secrets.GITHUB_TOKEN]
env_var = "GITHUB_TOKEN"
allowed_hosts = ["github.com", "api.github.com"]
required = false
