[package]
name = "agentctl"
version = "0.1.0"
edition = "2021"
description = "Control plane CLI for the AI workbench (Rust + Microsandbox SDK)."
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "agentctl"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
microsandbox = { version = "=0.5.6", features = ["net"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }

[profile.release]
opt-level = 3
lto = "thin"

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
