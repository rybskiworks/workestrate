[package]
name = "workestrate"
version = "0.1.0"
edition = "2021"
description = "Control plane CLI for the AI workbench (Rust + Microsandbox SDK)."
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "workestrate"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
glob = "0.3.4"
microsandbox = { version = "=0.6.8", features = ["net"] }
schemars = { version = "0.8", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
toml = "0.8"

[features]
# Activates schemars::JsonSchema derives across config + plan types.
# Required by `workestrate generate-schema` and the schema-drift CI guard.
default = ["schema"]
schema = ["dep:schemars"]

[profile.release]
opt-level = 3
lto = "thin"

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
