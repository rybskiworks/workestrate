[package]
name = "workestrate"
version = "0.1.0"
edition = "2021"
description = "Control plane CLI for the AI workbench (Rust + Microsandbox SDK)."
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "workestrate"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
microsandbox = { version = "=0.5.6", features = ["net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
toml = "0.8"

[profile.release]
opt-level = 3
lto = "thin"

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
