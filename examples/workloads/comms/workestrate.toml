schema_version = 1

[workloads.server]
kind = "service"
image = { recipe = "nix-layered", name = "workestrate-network-smoke", tag = "latest" }
cpus = 1
memory_mib = 256
workdir = "/tmp"
command = [
  "/bin/sh",
  "-c",
  "mkdir -p /tmp/www; echo DEPENDENCY_OK > /tmp/www/index.html; exec python3 -u -m http.server 8080 --bind 0.0.0.0 --directory /tmp/www",
]
log_stop_errors = true
ports = [{ host = 18080, guest = 8080 }]

[workloads.server.instance]
on_conflict = "fail"
port = "auto"

[workloads.server.network.defaults]
egress = "deny"
ingress = "deny"

[[workloads.server.policy.ingress.allow.port]]
ports = [8080]
protocol = "tcp"
scope = "local"

[workloads.client]
kind = "service"
image = { recipe = "nix-layered", name = "workestrate-network-smoke", tag = "latest" }
cpus = 1
memory_mib = 256
workdir = "/tmp"
command = [
  "python3",
  "-u",
  "-c",
  """import os, time, urllib.request
address = os.environ["SMOKE_SERVER"]
print("DEPENDENCY_ADDRESS=" + address, flush=True)
body = urllib.request.urlopen("http://" + address + "/", timeout=15).read().decode().strip()
assert body == "DEPENDENCY_OK", body
print("DEPENDENCY_OK", flush=True)
time.sleep(300)
""",
]
log_stop_errors = true

[workloads.client.instance]
on_conflict = "fail"

[workloads.client.network.defaults]
egress = "deny"
ingress = "deny"

[workloads.client.depends_on.server]
env = "SMOKE_SERVER"
required = true
instance = "shared"
on_conflict = ["reuse", "fail"]
