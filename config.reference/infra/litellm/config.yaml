# LiteLLM proxy — workestrator, in-memory, no Postgres/Redis.
# model_list lives in models.yaml (included below). Clients request tier aliases
# (coding/coding.fast/coding.pro/coding.free) + neural-* (Neuralwatt catalog)
# + openrouter-kimi-k3/kimi-code-k3 (Kimi K3 direct-select: OpenRouter / Kimi Coding Plan).
include:
  - models.yaml

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  disable_spend_logs: true

router_settings:
  fallbacks:
    - coding: [kimi-code-k3, neural-kimi-k2.7-code, coding.free]
    - coding.fast: [neural-qwen3.6-35b, coding]
    - coding.pro: [neural-glm-5.2, neural-kimi-k2.7-code]
    - coding.free: [neural-qwen3.6-35b-fast]
    - coding.vision: [neural-qwen3.6-35b, neural-kimi-k2.7-code]
    - orchestrator: [neural-glm-5.2-short, neural-qwen3.5-397b]
    - lead: [neural-glm-5.2, neural-kimi-k2.7-code]
    - vision: [neural-qwen3.6-35b]
  num_retries: 2
  timeout: 300
  stream_timeout: 300
  allowed_fails: 3
  cooldown_time: 60
  retry_policy:
    TimeoutErrorRetries: 2
    RateLimitErrorRetries: 3
    InternalServerErrorRetries: 2

litellm_settings:
  drop_params: true
  request_timeout: 300
  force_ipv4: true
