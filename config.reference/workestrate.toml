schema_version = 1

# Synthetic reference config. This is a machine-independent fixture that
# exercises every recipe type and policy feature the core understands. It is
# NOT a real deployment; user deployments live in personal config repos.

[secrets.LITELLM_MASTER_KEY]
env_var = "LITELLM_MASTER_KEY"
hosts = ["host.microsandbox.internal"]
required = true
description = "LiteLLM proxy authentication. Agents use this in milestone 1."

[secrets.LITELLM_AUTH]
source = "LITELLM_MASTER_KEY"
exposed_as = "OPENAI_API_KEY"

[secrets.GITHUB_TOKEN]
env_var = "GITHUB_TOKEN"
hosts = ["github.com", "api.github.com"]
required = false
description = "GitHub Personal Access Token for agent sandboxes (git operations + API)."

[workloads.example-service]
kind = "service"
image = { recipe = "registry", ref = "python:3.12-slim" }
workdir = "/app"
cpus = 2
memory_mib = 1024
command = ["python", "-m", "http.server", "8080"]
log_stop_errors = true

[[workloads.example-service.env]]
name = "APP_PORT"
value = "8080"

[[workloads.example-service.secret_env]]
secret = "LITELLM_AUTH"

[[workloads.example-service.ports]]
host = 8080
guest = 8080

[[workloads.example-service.mounts]]
host = "workspaces/example-service-state"
guest = "/data"
read_only = false

[[workloads.example-service.mounts]]
host = "config.reference/infra/litellm"
guest = "/app/config"
read_only = true

[[workloads.example-service.seed_files]]
source = "config.reference/agents/example-service/config/settings.json"
target = "workspaces/example-service-state/settings.json"
only_if_missing = true

[workloads.example-service.network]
default_deny = true

[[workloads.example-service.network.egress]]
recipe = "dns"

[[workloads.example-service.network.egress]]
recipe = "https"
hosts = ["github.com", "api.github.com"]

[[workloads.example-service.network.ingress]]
protocol = "tcp"
port = 8080
scope = "local"

[workloads.example-agent]
kind = "agent"
image = { recipe = "nix-layered", name = "example-agent", tag = "latest", contents = ["cacert", "busybox", "fakeNss"], binary = { recipe = "npm-build", src = "flake://example-agent", npm_deps_hash = "sha256-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=", install_layout = "app" }, baked_files = [{ path = "root/.config/example/settings.json", content = '{"mode":"test"}' }], features = ["create_tmp"] }
workdir = "/work"
cpus = 1
memory_mib = 512
command = ["node", "dist/cli.js"]
log_stop_errors = false

[[workloads.example-agent.env]]
name = "API_KEY"
secret = "LITELLM_MASTER_KEY"

[[workloads.example-agent.secret_env]]
secret = "GITHUB_TOKEN"

[[workloads.example-agent.mounts]]
host = "workspaces/example-agent-state"
guest = "/data"
read_only = false

[workloads.example-agent.network]
default_deny = true

[[workloads.example-agent.network.egress]]
recipe = "agent_base"

[[workloads.example-agent.network.deny]]
domain_suffix = ".example.dev"

[workloads.example-agent.local_build]
recipe = "npm-build"
source = "flake://example-agent"
gating_file = "package-lock.json"
env_override = "WORKESTRATE_EXAMPLE_AGENT_BUILD"
fallback = "agents/example-agent/build"

[workloads.example-offensive]
kind = "agent"
image = { recipe = "nix-layered", name = "example-offensive", tag = "latest", contents = ["cacert", "busybox", "fakeNss", "nodejs_24", "nmap", "dnsutils"], binary = { recipe = "npm-build", src = "flake://example-offensive", npm_deps_hash = "sha256-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=", install_layout = "app" }, baked_files = [{ path = "root/.config/offensive/config.json", content = '{"defaultProvider":"local"}' }], features = ["create_tmp"] }
workdir = "/work"
cpus = 2
memory_mib = 2048
command = ["node", "dist/cli.js"]
log_stop_errors = false

[[workloads.example-offensive.secret_env]]
secret = "LITELLM_AUTH"

[[workloads.example-offensive.env]]
name = "T3MP3ST_HOST"
value = "127.0.0.1"

[[workloads.example-offensive.mounts]]
host = "workspaces/example-offensive-state"
guest = "/data"
read_only = false

[workloads.example-offensive.network]
default_deny = false

[[workloads.example-offensive.network.egress]]
recipe = "dns"

[[workloads.example-offensive.network.egress]]
recipe = "https"
hosts = ["openrouter.ai", "api.kimi.com", "api.neuralwatt.com", "api.minimax.io", "github.com", "api.github.com"]

[workloads.example-offensive.local_build]
recipe = "npm-build"
source = "flake://example-offensive"
gating_file = "package-lock.json"
env_override = "WORKESTRATE_EXAMPLE_OFFENSIVE_BUILD"
fallback = "agents/example-offensive/build"
