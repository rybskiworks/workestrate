<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">workestrate / rybskiworks</title>
  <desc id="desc">Systems that let software act. Declarative configuration feeds a shared control plane and individual agent and service microVMs. Conceptual responsibilities, not a network topology or a verified security claim.</desc>
