<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Configuration layering</title>
  <desc id="desc">Reference config, ordered context layers, user-global overrides, then trusted project and local layers. WORKESTRATE_CONFIG_DIR bypasses discovery with a single dev layer. Lowest layer at the bottom, highest precedence at the top.</desc>
  <defs>
    <linearGradient id="ink" x1="44" y1="0" x2="1156" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#80b5ff"/><stop offset=".3" stop-color="#f19a9e"/><stop offset=".65" stop-color="#f19a9e"/><stop offset="1" stop-color="#80b5ff"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#334256"/></pattern>
  </defs>
  <rect x="1" y="1" width="1198" height="358" rx="18" fill="#0d1117" stroke="#293545"/>
  <g font-family="ui-monospace, 'DejaVu Sans Mono', monospace" font-size="12" fill="#9baabd">
    <text x="46" y="36" letter-spacing="1.4">lowest precedence at the bottom</text>
    <text x="1154" y="36" text-anchor="end">highest precedence at the top</text>
  </g>
  <rect x="650" y="60" width="504" height="240" rx="12" fill="url(#dots)" opacity=".55"/>
  <g font-family="ui-monospace, 'DejaVu Sans Mono', monospace" font-size="12" fill="#9baabd">
    <text x="674" y="88">layer stack</text>
    <text x="1130" y="88" text-anchor="end">merge order</text>
  </g>
  <g font-family="ui-monospace, 'DejaVu Sans Mono', monospace" font-size="13" fill="#edf2f7">
    <rect x="674" y="100" width="456" height="34" rx="8" fill="#161b22" stroke="#293545"/>
    <text x="690" y="122">4 - trusted project / local</text>
    <rect x="674" y="142" width="456" height="34" rx="8" fill="#161b22" stroke="#293545"/>
    <text x="690" y="164">3 - user-global overrides</text>
    <rect x="674" y="184" width="456" height="34" rx="8" fill="#161b22" stroke="#293545"/>
    <text x="690" y="206">2 - context layers (ordered)</text>
    <rect x="674" y="226" width="456" height="34" rx="8" fill="none" stroke="url(#ink)" stroke-width="2"/>
    <text x="690" y="248">1 - reference config</text>
  </g>
  <path d="M902 260V292M902 276H756Q740 276 740 292V300M902 276H1048Q1064 276 1064 292V300" fill="none" stroke="url(#ink)" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="42" y="130" font-size="64" font-weight="700" letter-spacing="-3" fill="url(#ink)">layering</text>
    <text x="46" y="180" font-size="26" fill="#edf2f7">reference to local,</text>
    <text x="46" y="212" font-size="26" fill="#edf2f7">lowest wins last.</text>
  </g>
  <text x="46" y="258" font-family="ui-monospace, 'DejaVu Sans Mono', monospace" font-size="13" fill="#9baabd">WORKESTRATE_CONFIG_DIR bypasses discovery</text>
  <path d="M46 280H420" stroke="#293545"/>
  <g font-family="ui-monospace, 'DejaVu Sans Mono', monospace" font-size="13" fill="#9baabd">
    <text x="46" y="306">single dev layer</text>
    <text x="46" y="330">no merge, no trust</text>
  </g>
  <path d="M46 344H1154" stroke="#293545"/>
  <g font-family="ui-monospace, 'DejaVu Sans Mono', monospace" font-size="13" fill="#9baabd">
    <text x="46" y="352">reference / layers / overrides / project</text>
  </g>
</svg>
