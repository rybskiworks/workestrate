# =============================================================================
# moonshot-kimi.yaml
# =============================================================================
# TWO clearly-separated variants:
#   (a) DOCUMENTED `moonshot/` prefix — OpenAI-compatible Moonshot API.
#   (b) WORKESTRATE `anthropic/kimi-for-coding` — Anthropic Messages API at
#       Kimi's coding endpoint. PROJECT-SPECIFIC / UNCERTAIN.
#
# VERIFIED FROM DOCS (providers/moonshot.md,
#   source: https://docs.litellm.ai/docs/providers/moonshot):
#   - Prefix: `moonshot/` — "We support ALL Moonshot AI models, just set
#     `moonshot/` as a prefix when sending completion requests."
#   - Default Global API Base URL (verbatim): `https://api.moonshot.ai/v1`
#     ("This is the one currently implemented").
#   - China API Base URL (verbatim): `https://api.moonshot.cn/v1` (override via
#     `MOONSHOT_API_BASE`).
#   - Documented model strings (verbatim): `moonshot/moonshot-v1-8k`,
#     `moonshot/moonshot-v1-32k`, `moonshot/moonshot-v1-128k`,
#     `moonshot/kimi-k2.5`, `moonshot/kimi-latest`.
#   - Required env var: `MOONSHOT_API_KEY`.
#   - Verbatim proxy YAML uses `model: moonshot/moonshot-v1-8k` +
#     `api_key: os.environ/MOONSHOT_API_KEY`.
#   - CAVEAT (verbatim): "The page does NOT document using Moonshot via the
#     `anthropic/` prefix with a custom api_base." and "The page does NOT
#     mention `api.kimi.com/coding` or any Kimi-specific coding endpoint."
#
# VERIFIED FROM DOCS (providers/anthropic.md,
#   source: https://docs.litellm.ai/docs/providers/anthropic):
#   - `anthropic/` prefix + custom `api_base` IS documented. LiteLLM
#     auto-appends `/v1/messages` to the api_base.
#   - `LITELLM_ANTHROPIC_DISABLE_URL_SUFFIX=true` disables auto-append.
#
# REQUIRED ENV VARS:
#   - MOONSHOT_API_KEY  (for variant a)
#   - ANTHROPIC_API_KEY (for variant b — project-specific)
#
# SECRET HYGIENE: NEVER commit real API keys. Use `os.environ/<VAR>` indirection.
#
# WORKESTRATE NOTES [PROJECT CONTEXT — NOT upstream docs]:
#   - Moonshot AI = the company; Kimi = their model line.
#   - Variant (b) `anthropic/kimi-for-coding` is NOT documented on the moonshot
#     page; it is inferred from the Anthropic page's Custom API Base section.
#     Kimi's coding endpoint (api.kimi.com/coding) speaks the Anthropic Messages
#     API, NOT the OpenAI-compatible API — hence the `anthropic/` prefix.
#     LiteLLM auto-appends `/v1/messages` → final URL
#     `https://api.kimi.com/coding/v1/messages`.
# =============================================================================

# --- VARIANT (a): DOCUMENTED moonshot/ prefix (OpenAI-compatible) ------------
model_list:
  - model_name: moonshot-v1-128k          # alias (placeholder)
    litellm_params:
      model: moonshot/moonshot-v1-128k    # VERIFIED prefix + verbatim model string
      api_key: os.environ/MOONSHOT_API_KEY  # VERIFIED required env var
      # api_base defaults to https://api.moonshot.ai/v1 (VERIFIED) — omit to use default.
      # For the China endpoint, uncomment:
      # api_base: https://api.moonshot.cn/v1  # VERIFIED China endpoint via MOONSHOT_API_BASE

  - model_name: kimi-k2.5                 # alias (placeholder)
    litellm_params:
      model: moonshot/kimi-k2.5           # VERIFIED verbatim model string
      api_key: os.environ/MOONSHOT_API_KEY

  # --- VARIANT (b): WORKESTRATE anthropic/kimi-for-coding (UNCERTAIN) ------
  # NOT documented on the moonshot page. Inferred from the Anthropic page's
  # Custom API Base section. PROJECT-SPECIFIC.
  # TODO: verify api.kimi.com/coding accepts Anthropic Messages API and that
  #       the `kimi-for-coding` model name is correct (not in upstream docs).
  - model_name: kimi-for-coding-anthropic  # alias (placeholder)
    litellm_params:
      model: anthropic/kimi-for-coding     # PROJECT-SPECIFIC: anthropic/ prefix at non-Anthropic endpoint
      api_key: os.environ/ANTHROPIC_API_KEY  # PROJECT-SPECIFIC env var
      api_base: https://api.kimi.com/coding  # PROJECT-SPECIFIC; LiteLLM auto-appends /v1/messages
