# =============================================================================
# split-config-parent.yaml
# Parent config demonstrating config splitting via the `include` directive.
# =============================================================================
#
# ANTI-HALLUCINATION GROUNDING:
#   - The `include:` directive is VERIFIED VERBATIM from the upstream
#     "File Management" page (/docs/proxy/config_management). Raw source:
#     https://raw.githubusercontent.com/BerriAI/litellm-docs/main/docs/proxy/config_management.md
#     Verbatim: "You can use `include` to include external YAML files in a
#     config.yaml." The key is a top-level list of filenames.
#   - Verbatim upstream syntax (single file or list of files):
#       include:
#         - model_config.yaml
#   - See docs/litellm/extracted/p0-config_management.md for the full verbatim
#     extraction and docs/litellm/config/config-management.md for the human doc.
#   - All OTHER keys (model_list [in child], general_settings.master_key,
#     general_settings.completion_model, litellm_settings.drop_params) ARE
#     verified verbatim from docs/litellm/schemas/config-yaml.option-index.json.
#
# PROJECT REALITY (workestrate): the real config at infra/litellm/config.yaml is
# a single monolithic file (no include). This example is illustrative only.
#
# SECRETS: master_key uses os.environ/ indirection. NEVER commit real values.
# Required env var: LITELLM_MASTER_KEY.
#
# WORKESTRATE-SPECIFIC: the include-based split is a recommendation for teams
# who want to separate model definitions from proxy settings. workestrate does
# not currently use it. Marked [WORKESTRATE RECOMMENDATION] below. NOTE: the
# config is mounted read-only at /app/config.yaml in the microsandbox, so even
# with include there is no hot-reload (hot-reload is NOT documented upstream on
# the config_management page in any case).

# VERIFIED VERBATIM (config_management page): top-level `include` directive to
# merge child config files. The child file split-config-models.yaml (sibling in
# this dir) supplies the model_list. A child file may contain ONLY a top-level
# section (e.g. model_list:) with no wrapper — confirmed by the verbatim upstream
# example where model_config.yaml contains only a top-level model_list:.
# [WORKESTRATE RECOMMENDATION] split by area: one child for models, one for
# router_settings, one for general_settings, to keep diffs reviewable.
include:
  - split-config-models.yaml

general_settings:
  # Verified: option-index general_settings.master_key (string).
  master_key: os.environ/LITELLM_MASTER_KEY
  # Verified: option-index general_settings.completion_model (string).
  completion_model: primary

litellm_settings:
  # Verified: option-index litellm_settings.drop_params (bool; ex: `drop_params: True`).
  drop_params: true
