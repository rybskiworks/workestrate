# =============================================================================
# multi-provider-router.yaml
# Multi-provider router with primary + fallback aliases and a retry policy.
# =============================================================================
#
# ANTI-HALLUCINATION GROUNDING:
#   - All router_settings keys verified verbatim from
#     docs/litellm/schemas/config-yaml.option-index.json (router_settings section):
#       routing_strategy (default=simple-shuffle), fallbacks (type=list;
#         ex: `fallbacks: [{"zephyr-beta": ["gpt-4o"]}]`),
#       retry_policy (type=dict; ex: `retry_policy: {TimeoutErrorRetries: 3}`),
#       num_retries (default=3), timeout (default=10 minutes),
#       stream_timeout, allowed_fails, cooldown_time (default=30),
#       disable_cooldowns, max_fallbacks (default=5).
#   - general_settings.master_key, completion_model — option-index.
#   - litellm_settings.drop_params — option-index.
#   - Provider prefixes verified from
#     docs/litellm/schemas/provider-fields.index.json:
#       openrouter/ (litellm_prefix: openrouter/, required_env_vars:
#         [OPENROUTER_API_KEY]; nested form openrouter/<provider>/<model>).
#       openai/ (litellm_prefix: openai/, required_env_vars: [OPENAI_API_KEY];
#         api_base MUST include /v1 postfix).
#
# ALIASES: this example uses GENERIC aliases (primary / primary-fallback) that
# mirror the workestrator coding-tier pattern WITHOUT real provider keys. The
# real config uses coding / coding-fallback etc. (see microvm-safe-proxy.yaml).
#
# SECRETS: master_key and all api_key values use os.environ/ indirection. NEVER
# commit real values. Required env vars: LITELLM_MASTER_KEY, OPENROUTER_API_KEY,
# OPENAI_API_KEY.
#
# WORKESTRATOR-SPECIFIC: the alias-naming convention (primary / primary-fallback)
# is a [WORKESTRATOR RECOMMENDATION] mirroring the coding-tier failover pattern.
# The router_settings keys themselves are upstream-documented.

model_list:
  - model_name: primary
    litellm_params:
      model: openrouter/openai/gpt-4o
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: primary-fallback
    litellm_params:
      # openai/ prefix + api_base is the documented OpenAI-compatible pattern
      # (provider-fields.index.json openai/ entry). api_base needs /v1 postfix.
      model: openai/gpt-4o
      api_base: https://api.example.com/v1
      api_key: os.environ/OPENAI_API_KEY

general_settings:
  # Verified: option-index general_settings.master_key (string).
  master_key: os.environ/LITELLM_MASTER_KEY
  # Verified: option-index general_settings.completion_model (string).
  completion_model: primary

litellm_settings:
  # Verified: option-index litellm_settings.drop_params (bool).
  drop_params: true

router_settings:
  # routing_strategy: Verified router_settings.routing_strategy (default=simple-shuffle).
  routing_strategy: simple-shuffle

  # fallbacks: Verified router_settings.fallbacks (type=list;
  #   ex: `fallbacks: [{"zephyr-beta": ["gpt-4o"]}]`). Maps a model group to its
  #   ordered fallback groups. [WORKESTRATOR RECOMMENDATION] mirror the
  #   coding-tier failover pattern: <tier> -> [<tier>-fallback].
  fallbacks:
    - primary: [primary-fallback]

  # num_retries: Verified router_settings.num_retries (default=3).
  num_retries: 2
  # timeout: Verified router_settings.timeout (default=10 minutes).
  timeout: 300
  # stream_timeout: Verified router_settings.stream_timeout (ex: `stream_timeout: 300`).
  stream_timeout: 300
  # allowed_fails: Verified router_settings.allowed_fails (ex: `allowed_fails: 3`).
  allowed_fails: 3
  # cooldown_time: Verified router_settings.cooldown_time (default=30).
  cooldown_time: 60
  # max_fallbacks: Verified router_settings.max_fallbacks (default=5).
  max_fallbacks: 2

  # retry_policy: Verified router_settings.retry_policy (type=dict;
  #   ex: `retry_policy: {TimeoutErrorRetries: 3}`). The retry-class keys below
  #   (TimeoutErrorRetries, RateLimitErrorRetries, InternalServerErrorRetries)
  #   are taken from the option-index example and the workestrator
  #   recommendation note on retry_policy.
  retry_policy:
    TimeoutErrorRetries: 2
    RateLimitErrorRetries: 3
    InternalServerErrorRetries: 2
