# =============================================================================
# minimax.yaml
# =============================================================================
# MiniMax — DOCUMENTED `minimax/` prefix pattern (both Anthropic Messages and
# OpenAI-compatible endpoints), PLUS a clearly-marked workestrator DEVIATION.
#
# VERIFIED FROM DOCS (providers/minimax.md,
#   source: https://docs.litellm.ai/docs/providers/minimax):
#   - Prefix: `minimax/` — used for BOTH Anthropic Messages API and
#     OpenAI-compatible API.
#   - Documented model strings (verbatim): `minimax/MiniMax-M2.1`,
#     `minimax/MiniMax-M2.1-lightning`, `minimax/MiniMax-M2`.
#   - Anthropic Messages api_base (verbatim):
#       https://api.minimax.io/anthropic/v1/messages
#   - OpenAI-compatible api_base (verbatim):
#       https://api.minimax.io/v1
#   - Required env var: `MINIMAX_API_KEY`.
#   - Verbatim proxy YAML (Anthropic Messages endpoint):
#       model_list:
#         - model_name: minimax/MiniMax-M2.1
#           litellm_params:
#             model: minimax/MiniMax-M2.1
#             api_key: os.environ/MINIMAX_API_KEY
#             api_base: https://api.minimax.io/anthropic/v1/messages
#   - CAVEAT (verbatim): "`minimax/MiniMax-M3` is NOT documented — only
#     M2-series models (M2, M2.1, M2.1-lightning)."
#
# VERIFIED FROM DOCS (providers/anthropic.md,
#   source: https://docs.litellm.ai/docs/providers/anthropic):
#   - `anthropic/` prefix + custom `api_base` IS documented. LiteLLM
#     auto-appends `/v1/messages` to the api_base.
#   - `LITELLM_ANTHROPIC_DISABLE_URL_SUFFIX=true` disables auto-append.
#
# REQUIRED ENV VARS:
#   - MINIMAX_API_KEY  (for documented `minimax/` path)
#   - ANTHROPIC_API_KEY (for the DEVIATION `anthropic/` path — see below)
#
# SECRET HYGIENE: NEVER commit real API keys. Use `os.environ/<VAR>` indirection.
#
# WORKESTRATOR DEVIATION [PROJECT CONTEXT — NOT upstream docs, UNCERTAIN]:
#   The repo uses `anthropic/MiniMax-M3` with `api_base: api.minimax.io/anthropic`.
#   This DEVIATES from the documented `minimax/` prefix pattern. Both may work
#   (the Anthropic page permits custom api_base), but the documented approach is
#   `minimax/`. `MiniMax-M3` is NOT in the docs (only M2-series) — model name
#   needs verification. LiteLLM auto-appends `/v1/messages`, so the deviation's
#   final URL is `api.minimax.io/anthropic/v1/messages` (matches MiniMax docs).
# =============================================================================

# --- DOCUMENTED PATH 1: Anthropic Messages endpoint (minimax/ prefix) -------
model_list:
  - model_name: minimax-m2.1-anthropic    # alias (placeholder)
    litellm_params:
      model: minimax/MiniMax-M2.1         # VERIFIED prefix + verbatim model string
      api_key: os.environ/MINIMAX_API_KEY # VERIFIED required env var
      api_base: https://api.minimax.io/anthropic/v1/messages  # VERIFIED verbatim api_base

  # --- DOCUMENTED PATH 2: OpenAI-compatible endpoint (minimax/ prefix) ------
  - model_name: minimax-m2.1-openai       # alias (placeholder)
    litellm_params:
      model: minimax/MiniMax-M2.1         # VERIFIED prefix + verbatim model string
      api_key: os.environ/MINIMAX_API_KEY
      api_base: https://api.minimax.io/v1 # VERIFIED verbatim api_base

  # --- WORKESTRATOR DEVIATION (UNCERTAIN — NOT documented as correct) ------
  # TODO: verify MiniMax-M3 model name exists; it is NOT in the docs (only M2).
  # TODO: prefer the documented `minimax/` prefix path above unless there is a
  #       specific reason the `anthropic/` prefix is required.
  - model_name: minimax-m3-anthropic-deviation  # alias (placeholder)
    litellm_params:
      model: anthropic/MiniMax-M3          # DEVIATION: anthropic/ prefix, NOT documented minimax/ prefix
      api_key: os.environ/ANTHROPIC_API_KEY # DEVIATION: uses ANTHROPIC_API_KEY env var
      api_base: https://api.minimax.io/anthropic  # DEVIATION: omits /v1/messages; LiteLLM auto-appends it
