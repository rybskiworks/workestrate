# =============================================================================
# minimal-openai-compatible.yaml
# =============================================================================
# Canonical OpenAI-compatible endpoint pattern (Neuralwatt / vLLM style).
#
# VERIFIED FROM DOCS (providers/openai-compatible.md,
#   source: https://docs.litellm.ai/docs/providers/openai_compatible):
#   - Prefix: `openai/` — "Selecting `openai` as the provider routes your request
#     to an OpenAI-compatible endpoint using the upstream official OpenAI Python
#     API library."
#   - api_base MUST include the `/v1` postfix (verbatim): "If you see `Not Found
#     Error` when testing make sure your `api_base` has the `/v1` postfix.
#     Example: `http://vllm-endpoint.xyz/v1`"
#   - Do NOT append endpoint paths (verbatim): "Do NOT add anything additional to
#     the base url e.g. `/v1/embedding`. LiteLLM uses the openai-client to make
#     these calls, and that automatically adds the relevant endpoints."
#   - api_key is REQUIRED for all requests via the openai-client (verbatim):
#     "This library requires an API key for all requests, either through the
#     `api_key` parameter or the `OPENAI_API_KEY` environment variable."
#   - Verbatim proxy YAML shape from the docs:
#       model_list:
#         - model_name: my-model
#           litellm_params:
#             model: openai/<your-model-name>
#             api_base: <model-api-base>
#             api_key: api-key
#
# PLACEHOLDER / project-specific values (NOT from upstream docs):
#   - `neuralwatt` model name, `https://api.neuralwatt.com/v1` api_base, and the
#     `NEURALWATT_API_KEY` env var name are WORKESTRATE PROJECT CHOICES. They
#     follow the documented pattern but the specific host/key-name are not in
#     the upstream LiteLLM docs. Replace `<your-model-name>` / host / key with
#     your own OpenAI-compatible endpoint.
#
# REQUIRED ENV VARS:
#   - OPENAI_API_KEY  (or a provider-specific key passed via `api_key:`)
#     Here we use the project-specific NEURALWATT_API_KEY.
#
# SECRET HYGIENE: NEVER commit real API keys. Use `os.environ/<VAR>` indirection
# so LiteLLM reads the key from the environment at runtime.
#
# WORKESTRATE NOTES [PROJECT CONTEXT — NOT upstream docs]:
#   - This is the CANONICAL Neuralwatt pattern: `openai/neuralwatt` +
#     `api_base: https://api.neuralwatt.com/v1`. For keyless local vLLM, prefer
#     the `hosted_vllm/` prefix (see providers/vllm.md) to avoid passing a fake
#     api_key.
# =============================================================================

model_list:
  - model_name: neuralwatt            # project-specific alias (placeholder)
    litellm_params:
      model: openai/neuralwatt        # VERIFIED prefix `openai/` + project model name
      api_base: https://api.neuralwatt.com/v1   # VERIFIED: must include /v1, NO appended paths
      api_key: os.environ/NEURALWATT_API_KEY     # PLACEHOLDER env var name; secret must NOT be committed
