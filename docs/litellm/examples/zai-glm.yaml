# =============================================================================
# zai-glm.yaml
# =============================================================================
# Z.AI (Zhipu AI) GLM models — TWO distinct routing paths:
#   (a) NATIVE `zai/` prefix (no hyphen) — for GLM-4.x models.
#   (b) OpenRouter `openrouter/z-ai/glm-5.1` (hyphenated `z-ai`) — for GLM-5.1.
#
# VERIFIED FROM DOCS (providers/zai-glm.md,
#   source: https://docs.litellm.ai/docs/providers/zai):
#   - Prefix: `zai/` (no hyphen) — "We support Z.AI GLM text/chat models, just
#     set `zai/` as a prefix when sending completion requests."
#   - CRITICAL (verbatim): "The prefix is `zai/` (no hyphen) — NOT `z-ai/`
#     (hyphenated). OpenRouter uses `z-ai/` for the same provider."
#   - Documented model strings (verbatim): `zai/glm-4.7`, `zai/glm-4.6`,
#     `zai/glm-4.5`, `zai/glm-4.5v`, `zai/glm-4.5-x`, `zai/glm-4.5-air`,
#     `zai/glm-4.5-airx`, `zai/glm-4-32b-0414-128k`, `zai/glm-4.5-flash`.
#   - Required env var: `ZAI_API_KEY`.
#   - api_base is NOT documented on this page (verbatim: "No `api_base` is shown
#     in any example.").
#   - CAVEAT (verbatim): "GLM-5.1 is NOT documented on this page — only
#     GLM-4.x models."
#   - Verbatim proxy YAML:
#       model_list:
#         - model_name: glm-4.7
#           litellm_params:
#             model: zai/glm-4.7
#             api_key: os.environ/ZAI_API_KEY
#
# VERIFIED FROM DOCS (providers/openrouter.md,
#   source: https://docs.litellm.ai/docs/providers/openrouter):
#   - Nested format `openrouter/<provider>/<model>` is the documented pattern.
#   - Required env var: `OPENROUTER_API_KEY`.
#
# REQUIRED ENV VARS:
#   - ZAI_API_KEY        (for native `zai/` path)
#   - OPENROUTER_API_KEY (for the OpenRouter GLM-5.1 path)
#
# SECRET HYGIENE: NEVER commit real API keys. Use `os.environ/<VAR>` indirection.
#
# WORKESTRATOR NOTES [PROJECT CONTEXT — NOT upstream docs]:
#   - GLM-5.1 routes via OpenRouter (`openrouter/z-ai/glm-5.1`), NOT native
#     `zai/`. Do NOT change `openrouter/z-ai/glm-5.1` to `zai/glm-5.1` —
#     GLM-5.1 is not in the native Z.AI docs and would likely fail routing.
#   - `zai/` (no hyphen) vs `z-ai/` (hyphenated) is a CRITICAL spelling
#     difference between the two routing paths.
#   - `openrouter/z-ai/glm-5.1` is INFERRED-valid (follows documented nested
#     format) but NOT verbatim on the OpenRouter page.
# =============================================================================

# --- PATH (a): NATIVE zai/ prefix (no hyphen) — GLM-4.x ---------------------
model_list:
  - model_name: glm-4.7                  # alias (placeholder)
    litellm_params:
      model: zai/glm-4.7                 # VERIFIED prefix (no hyphen) + verbatim model string
      api_key: os.environ/ZAI_API_KEY    # VERIFIED required env var
      # api_base NOT documented on the zai page — omitted intentionally.

  - model_name: glm-4.5-flash            # alias (placeholder); Free tier
    litellm_params:
      model: zai/glm-4.5-flash           # VERIFIED verbatim model string
      api_key: os.environ/ZAI_API_KEY

  # --- PATH (b): OpenRouter z-ai/ namespace (hyphenated) — GLM-5.1 ----------
  # GLM-5.1 is NOT in the native Z.AI docs; route via OpenRouter.
  - model_name: glm-5.1                  # alias (placeholder)
    litellm_params:
      model: openrouter/z-ai/glm-5.1     # INFERRED: nested format valid; z-ai is OpenRouter's Z.AI namespace
      api_key: os.environ/OPENROUTER_API_KEY  # VERIFIED required env var for OpenRouter
