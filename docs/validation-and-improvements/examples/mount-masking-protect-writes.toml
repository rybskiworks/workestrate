# Example: protect tier and write rules (spec 22 §10).
#
# The protect tier is an operator-only tier: an operator scope's final
# read.deny compiles to the protect wire bucket — protected paths are hidden
# AND untouchable, independently of the finality axis. Only operator scopes
# (home registry, user-global overrides) may declare final allows, and only
# their final read.deny entries protect. Write rules are
# pattern-keyed: default is allow+tag; deny beats allow; final deny freezes.
#
# This file is a fragment illustrating the operator-scope (home registry)
# policy surface. It is NOT a complete config (no schema_version/workloads) —
# it is meant to be dropped into a home registry `config.toml` or
# `overrides.toml`.

# ---------------------------------------------------------------------------
# Operator scope: home registry [policy.mounts].
# Protect the admin tree (hidden + untouchable) and deny writes to config.
# ---------------------------------------------------------------------------
[policy.mounts.read]
deny = [
  # Protection is operator-only: this final read.deny routes to the protect
  # wire bucket. A config-repo or workload layer cannot unprotect these paths
  # (operator trust model — spec 22 §5).
  { pattern = "**/admin/**", final = true },
  # Non-final: deny the secrets tree; lower scopes may allow specific files.
  "secrets/**",
]

[policy.mounts.write]
# Deny writes to the config tree; allow writes to the data tree.
# Deny beats allow on overlap; a final deny (final = true) freezes.
deny = [
  "config/**",
  { pattern = "state/lock/**", final = true },
]
allow = ["data/**"]

# ---------------------------------------------------------------------------
# A workload that inherits the operator protect + write rules and adds its
# own workload-scope carve-out. The workload CANNOT unprotect admin/
# (operator-only) but CAN re-expose a specific secret file (the operator's
# secrets deny is non-final).
# ---------------------------------------------------------------------------
[workloads.worker]
kind = "service"
image = { recipe = "registry", ref = "python:3.12-slim" }
command = ["python", "-m", "http.server", "9000"]

[workloads.worker.policy.mounts.read]
# Carve out a specific secret the worker needs (the operator deny above is
# non-final).
allow = ["secrets/api-token"]

[[workloads.worker.mounts]]
host = "workspaces/worker"
guest = "/data"
read_only = false
