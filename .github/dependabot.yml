# Cargo updates remain deliberately excluded: its lock and forks are managed.
# This configuration must also be present on the repository default branch.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: migration/tool-model
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
