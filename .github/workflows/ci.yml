# Workestrate edge CI: bounded PR checks plus explicitly selected Nix tiers.
# Never enter the complete devenv closure on a GitHub-hosted PR runner.
# The nix-ci label and build-then-execute pattern were adapted from
# akitaonrails/ai-memory, MIT, (c) 2026 Fabio Akita; attribution retained.
# KVM/ignored runtime tests are NOT certified by this workflow.
name: ci
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]
  push:
    branches: [migration/tool-model, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_INCREMENTAL: '0'
  # Action code and installed compiler are independently pinned.
  RUST_TOOLCHAIN: '1.97.1'
jobs:
  changes:
    name: CI selection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      code: ${{ steps.select.outputs.code }}
      nix: ${{ steps.select.outputs.nix }}
      build: ${{ steps.select.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: select
        run: python3 scripts/ci/select_checks.py

  policy:
    name: CI contract and version metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s scripts/ci/tests -v
      - run: python3 scripts/ci/check_release_metadata.py

  gates:
    name: gates (light PR quality gates, no devenv)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install exact Rust toolchain
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # reviewed master snapshot
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - name: Toolchain guard
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import os, re, subprocess
          from pathlib import Path
          marker = re.findall(r'rustToolchain = inputs\.fenix[^\n]*# RUST_TOOLCHAIN_VERSION = "([0-9]+\.[0-9]+)"', Path('flake.nix').read_text())
          expected = os.environ['RUST_TOOLCHAIN']
          actual = subprocess.check_output(['rustc', '--version'], text=True).split()[1]
          if len(marker) != 1 or marker[0] != '.'.join(expected.split('.')[:2]) or actual != expected:
              raise SystemExit(f'Toolchain mismatch: flake marker={marker}, CI={expected}, installed={actual}')
          print(f'Exact compiler {actual}; major/minor matches the flake marker. Fenix revision remains locked.')
          PYCODE
      - name: Vendor microsandbox fork (flake.lock-pinned revision)
        run: |
          set -euo pipefail
          rev=$(python3 -c "import json; print(json.load(open('flake.lock'))['nodes']['microsandbox-fork']['locked']['rev'])")
          [[ "$rev" =~ ^[0-9a-f]{40}$ ]] || exit 1
          mkdir -p "$RUNNER_TEMP/msb-fork" control/agentctl/vendor
          curl -fsSL "https://github.com/rybskiworks/microsandbox/archive/$rev.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/msb-fork" --strip-components=1
          ln -sfn "$RUNNER_TEMP/msb-fork" control/agentctl/vendor/microsandbox-fork
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: control/agentctl
      - run: ./scripts/check-cargo-lock.sh
      - run: ./scripts/check-msb-versions.sh
      - run: ./scripts/check-nix-paths.sh
      - run: cargo fmt --manifest-path control/agentctl/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path control/agentctl/Cargo.toml --all-targets -- -D warnings
      # This tier retains the existing prebuilt agentd fallback. It is not a
      # claim that ignored KVM tests or runtime-dependent tests executed.
      - run: cargo test --locked --manifest-path control/agentctl/Cargo.toml
      - run: git diff --exit-code HEAD -- control/agentctl/Cargo.lock

  e2e-nix:
    name: e2e-nix (nix-gated functional tests, self-contained tooling)
    needs: changes
    if: needs.changes.outputs.nix == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.8/install
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
        continue-on-error: true
      - run: nix build -L --no-update-lock-file .#microsandbox -o result-msb
      - name: Provision and prove runtime inputs
        run: |
          set -euo pipefail
          msb="$PWD/result-msb/bin/msb"
          agentd="$PWD/result-msb/libexec/agentd"
          test -f "$agentd"
          command -v nix
          command -v gunzip
          "$msb" --version
          echo "MSB_PATH=$msb" >> "$GITHUB_ENV"
          echo "MSB_AGENTD_PATH=$agentd" >> "$GITHUB_ENV"
      - name: Vendor microsandbox fork (flake.lock-pinned revision)
        run: |
          set -euo pipefail
          rev=$(python3 -c "import json; print(json.load(open('flake.lock'))['nodes']['microsandbox-fork']['locked']['rev'])")
          [[ "$rev" =~ ^[0-9a-f]{40}$ ]] || exit 1
          mkdir -p "$RUNNER_TEMP/msb-fork" control/agentctl/vendor
          curl -fsSL "https://github.com/rybskiworks/microsandbox/archive/$rev.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/msb-fork" --strip-components=1
          ln -sfn "$RUNNER_TEMP/msb-fork" control/agentctl/vendor/microsandbox-fork
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # reviewed master snapshot
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: control/agentctl
      - name: Nix functional tests with real msb and agentd
        run: >-
          cargo test --locked --manifest-path control/agentctl/Cargo.toml
          --test image_pipeline_e2e --test ensure_images_e2e
      - run: git diff --exit-code HEAD -- flake.lock control/agentctl/Cargo.lock

  heavy-build:
    name: heavy build (nix build .#workestrate, on-demand only)
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.8/install
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
        continue-on-error: true
      - run: nix build -L --no-update-lock-file .#workestrate
      - run: ./result/bin/workestrate --version
      - run: git diff --exit-code HEAD -- flake.lock control/agentctl/Cargo.lock

  actionlint:
    name: actionlint (workflow lint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Direct exit status, unlike reviewdog's default fail_level=none.
      - uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2.87.8
        with:
          tool: actionlint@1.7.7
      - run: actionlint

  zizmor:
    name: zizmor (workflow security audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2.87.8
        with:
          tool: zizmor@1.30.0
      - run: zizmor --format github .github/workflows/

  deny:
    name: deny (cargo-deny supply-chain gates, no devenv)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Vendor microsandbox fork (flake.lock-pinned revision)
        run: |
          set -euo pipefail
          rev=$(python3 -c "import json; print(json.load(open('flake.lock'))['nodes']['microsandbox-fork']['locked']['rev'])")
          [[ "$rev" =~ ^[0-9a-f]{40}$ ]] || exit 1
          mkdir -p "$RUNNER_TEMP/msb-fork" control/agentctl/vendor
          curl -fsSL "https://github.com/rybskiworks/microsandbox/archive/$rev.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/msb-fork" --strip-components=1
          ln -sfn "$RUNNER_TEMP/msb-fork" control/agentctl/vendor/microsandbox-fork
      - uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2.87.8
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --locked --manifest-path control/agentctl/Cargo.toml check licenses bans sources
      # Preserve the existing soft advisory policy. Network availability is
      # not conflated with the result of an authoritative vulnerability gate.
      - name: Advisories (informational)
        continue-on-error: true
        run: cargo deny --locked --manifest-path control/agentctl/Cargo.toml check advisories

  required-gates:
    # Preserve the existing check name for compatibility; broaden what it proves.
    name: required-gates (branch-protection anchor)
    needs: [changes, policy, gates, actionlint, zizmor, deny, e2e-nix, heavy-build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate the selected CI contract
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/ci/check_results.py

  required:
    name: CI / required
    needs: required-gates
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULT: ${{ needs.required-gates.result }}
        run: test "$RESULT" = success
