# =============================================================================
# OPENCODE FLEET - DOCKER COMPOSE CONFIGURATION
# =============================================================================
# Instances WITH dind: titan, enceladus, prometheus (3)
# Instances WITHOUT dind: europa, ganymede, nereid, carme, atlas (5)
# =============================================================================

x-agent-defaults: &agent-defaults
  build:
    context: .
    dockerfile: Dockerfile
  image: opencode-agent-base:3.1.0
  restart: unless-stopped
  env_file: .env
  security_opt:
    - no-new-privileges:true
  user: "${UID:-1000}:${GID:-1000}"

services:

  # ===========================================================================
  # BASE TEMPLATES (These do not run on their own)
  # ===========================================================================

  base-regular-agent:
    profiles: ["disabled"]
    <<: *agent-defaults
    volumes:
      - ${HOME}/.config/opencode:/home/node/.config/opencode:ro
      - ${HOME}/.config/opencode/.env.example:/home/node/.config/opencode/.env:ro
      - type: tmpfs
        target: /home/node/.config/opencode/.git
      - type: tmpfs
        target: /home/node/.config/opencode/.mcporter
      - ${HOME}/.config/opencode/.mcporter:/home/node/.mcporter:ro

  base-meta-agent:
    profiles: ["disabled"]
    <<: *agent-defaults
    volumes:
      - ${HOME}/.config/opencode:/home/node/.config/opencode:rw
      - ${HOME}/.config/opencode/.git:/home/node/.config/opencode/.git:ro
      - ${HOME}/.config/opencode/.env.example:/home/node/.config/opencode/.env:ro
      - type: tmpfs
        target: /home/node/.config/opencode/.mcporter
      - ${HOME}/.config/opencode/.mcporter:/home/node/.mcporter:rw

  # ===========================================================================
  # 1. TITAN (Backend Specialist)
  # ===========================================================================
  titan-dind:
    image: docker:dind-rootless
    container_name: opencode-titan-dind
    privileged: true
    environment:
      - DOCKER_TLS_CERTDIR=
    volumes:
      - titan-dind-data:/var/lib/docker

  titan:
    extends:
      service: base-regular-agent
    container_name: opencode-titan
    depends_on:
      - titan-dind
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - DOCKER_HOST=tcp://titan-dind:2375
    ports:
      - "3334:3000"
      - "8081:8080"
    volumes:
      - ./fleet/instances/titan/memory:/home/node/memory:rw
      - ./fleet/instances/titan/.opencode:/home/node/.opencode:rw
      - ./fleet/instances/titan/.local:/home/node/.local:rw
      - ./fleet/instances/titan/workbench:/home/node/workbench:rw
      - ./fleet/instances/titan/outputs:/home/node/outputs:rw
      - ./AGENTS.md:/home/node/.config/opencode/AGENTS.md:ro

  # ===========================================================================
  # 2. EUROPA (Frontend Specialist) - NO DIND
  # ===========================================================================

  europa:
    extends:
      service: base-meta-agent
    container_name: opencode-europa
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - OPENCODE_INSTANCE=europa
    ports:
      - "3335:3000"
      - "8082:8080"
    volumes:
      - type: tmpfs
        target: /home/node/.config/opencode/fleet/instances/europa
      - ./fleet/shared/TMPFS_INSTANCE_CONTEXT.md:/home/node/.config/opencode/fleet/instances/europa/YOU_ARE_EUROPA__THIS_IS_A_TMPFS__ACTUAL_CONTENTS_ARE_IN_YOUR_HOME_DIR.md:ro
      - ./fleet/instances/europa/opencode.jsonc:/home/node/.config/opencode/opencode.jsonc:ro
      - ./fleet/instances/europa/agents:/home/node/.config/opencode/agents:rw
      - ./fleet/instances/europa/memory:/home/node/memory:rw
      - ./fleet/instances/europa/.opencode:/home/node/.opencode:rw
      - ./fleet/instances/europa/.local:/home/node/.local:rw
      - ./fleet/instances/europa/workbench:/home/node/workbench:rw
      - ./fleet/instances/europa/outputs:/home/node/outputs:rw
      - ./fleet/instances/europa/skills:/home/node/.config/opencode/skills:rw
      - ./AGENTS.md:/home/node/.config/opencode/AGENTS.md:ro

  # ===========================================================================
  # 3. ENCELADUS (Integration Specialist)
  # ===========================================================================
  enceladus-dind:
    image: docker:dind-rootless
    container_name: opencode-enceladus-dind
    privileged: true
