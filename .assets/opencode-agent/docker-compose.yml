      - ./fleet/instances/enceladus/.opencode:/home/node/.opencode:rw
      - ./fleet/instances/enceladus/.local:/home/node/.local:rw
      - ./fleet/instances/enceladus/workbench:/home/node/workbench:rw
      - ./fleet/instances/enceladus/outputs:/home/node/outputs:rw
      - ./AGENTS.md:/home/node/.config/opencode/AGENTS.md:ro

