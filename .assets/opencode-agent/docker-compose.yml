      - ./fleet/shared/TMPFS_INSTANCE_CONTEXT.md:/home/node/.config/opencode/fleet/instances/ganymede/YOU_ARE_GANYMEDE__THIS_IS_A_TMPFS__ACTUAL_CONTENTS_ARE_IN_YOUR_HOME_DIR.md:ro
      - ./fleet/instances/ganymede/opencode.jsonc:/home/node/.config/opencode/opencode.jsonc:ro
      - ./fleet/instances/ganymede/agents:/home/node/.config/opencode/agents:rw
      - ./fleet/instances/ganymede/memory:/home/node/memory:rw
      - ./fleet/instances/ganymede/.opencode:/home/node/.opencode:rw
      - ./fleet/instances/ganymede/.local/share/opencode:/home/node/.local/share/opencode:rw
      - ./fleet/instances/ganymede/.local/state:/home/node/.local/state:rw
      - ./fleet/instances/ganymede/workbench:/home/node/workbench:rw
      - ./fleet/instances/ganymede/outputs:/home/node/outputs:rw
      - ./fleet/instances/ganymede/skills:/home/node/.config/opencode/skills:rw
      - ./fleet/instances/ganymede/AGENTS.md:/home/node/.config/opencode/AGENTS.md:ro

  # ===========================================================================
  # 5. NEREID (Specialist) - NO DIND
  # ===========================================================================

  nereid:
    extends:
      service: base-regular-agent
    container_name: opencode-nereid
    environment:
      - NODE_ENV=${NODE_ENV:-production}
    ports:
      - "3340:3000"
      - "8087:8080"
    volumes:
      - ./fleet/instances/nereid/memory:/home/node/memory:rw
