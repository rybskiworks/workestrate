# =============================================================================
# PROJECT OVERRIDES - DUELBITS
# =============================================================================

# 1. Define the "Source" paths once
x-paths:
  auth: &auth "${HOME}/.local/share/opencode/auth.json:/home/node/.local/share/opencode/auth.json:ro"
  backend: &backend "${HOME}/Development/duelbits/backend:/home/node/Development/backend:rw"
  frontend: &frontend "${HOME}/Development/duelbits/frontend:/home/node/Development/frontend:rw"
  frontend-19: &frontend-19 "${HOME}/Development/duelbits/frontend-19:/home/node/Development/frontend-19:rw"
  chadmin: &chadmin "${HOME}/Development/duelbits/chadmin:/home/node/Development/chadmin:rw"
  ad-hoc: &ad-hoc "${HOME}/Development/duelbits/ad-hoc:/home/node/Development/contentful-ad-hoc:rw"
  personal: &personal "${HOME}/Projects/personal:/home/node/projects/personal:rw"
  worktrees: &worktrees "${HOME}/Development/duelbits/worktree-sandbox:/home/node/Development/worktrees:rw"
  contentful: &contentful "${HOME}/.contentfulrc.json:/home/node/.contentfulrc.json:rw"
  ai-workbench: &ai-workbench "${HOME}/Development/ai-workbench:/home/node/Development/ai-workbench:rw"

# 2. Define skills mounts (read-only for regular agents, read-write for meta agents)
x-skills-ro: &skills-ro "./.agents/skills:/home/node/.agent/skills:ro"
x-skills-rw: &skills-rw "./.agents/skills:/home/node/.agent/skills:rw"

services:
  # --- Developer Agents (Auth + Code + Skills RO) ---
  titan:
    volumes: [*auth, *backend, *skills-ro]

  europa:
    volumes:
      - *auth
      - *backend
      - *frontend

  carme:
    volumes: [*auth, *backend, *frontend, *skills-rw, *personal]

  # --- Prometheus (Triton-Style Experimental Architecture with DinD) ---
  prometheus:
    volumes: [*auth, *backend, *frontend, *worktrees]

  # --- Support Agents (Auth + Skills RO) ---
  enceladus: { volumes: [*auth, *skills-ro] }

  ganymede:
    volumes:
      - *backend
      - *frontend
      - *frontend-19
      - *chadmin
      - *ad-hoc
      - *worktrees
      - *contentful
      - *ai-workbench

  nereid: { volumes: [*auth, *skills-ro, *personal] }

  # --- Meta Agents (Skills RW) ---
  atlas:
    volumes: [*skills-rw]

  # --- Triton (Experimental Architecture) ---
  triton:
    volumes: [*auth, *backend, *frontend, *worktrees]

  # --- Hyperion (Mantle-Only Clone of Triton) ---
  hyperion:
    volumes: [*backend, *frontend, *worktrees]

  # --- Rhea (Non-Mantle Testing) ---
  rhea:
    volumes: [*auth, *backend, *frontend]
